# Human-maintained Anaplan regional configuration for anaplan-mcp.
#
# This file contains endpoints and environment-variable names only.
# NEVER put usernames, passwords, client secrets, refresh tokens, certificates,
# or private keys directly in this file.
#
# Credentials default to the Hermes environment file below. Edit credentials.env_file
# if this installation uses a different .env location.

schema_version: 1
default_region: au1a
default_env_file: /home/cam/.hermes/.env

# Shared Anaplan Integration API endpoints.
# The selected region still controls which region-prefixed credentials are read.
shared:
  api_access_url: https://api.anaplan.com/2/0
  integration_url: https://api.anaplan.com
  token_url: https://auth.anaplan.com/token/authenticate

# Region entries.
#
# Required human review fields are marked REVIEW. Confirm the user-facing
# Playwright URL and OAuth URL for any region before enabling browser/OAuth flows.
# Environment variable names follow:
#   <REGION>_ANAPLAN_USERNAME
#   <REGION>_ANAPLAN_PASSWORD

regions:
  ae1:
    active: false
    nickname: United Arab Emirates 1
    api_access_url: https://api.anaplan.com/2/0
    playwright_access_url: REVIEW
    integration_url: https://api.anaplan.com
    token_url: https://auth.anaplan.com/token/authenticate
    oauth_token_url: REVIEW
    credentials: &credentials_ae1
      env_file: /home/cam/.hermes/.env
      username_env_var: AE1_ANAPLAN_USERNAME
      password_env_var: AE1_ANAPLAN_PASSWORD

